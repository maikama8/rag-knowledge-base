services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-offline}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      VECTOR_STORE: ${VECTOR_STORE:-local}
      DATA_DIR: /data
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      TOP_K: ${TOP_K:-4}
      MIN_SCORE: ${MIN_SCORE:-0.15}
      OFFLINE_EMBEDDING_DIMENSIONS: ${OFFLINE_EMBEDDING_DIMENSIONS:-512}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    volumes:
      - rag-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  rag-data:
